name: Build Windows Installer

on:
  # v2.2.7: 매 push 마다 빌드하지 않는다 — 무료 Actions 분(비공개 2,000분/월) 소진 방지.
  #   Windows 빌드는 '릴리스 태그(v*) 푸시' 또는 '수동 실행(Actions 탭 Run workflow)' 시에만 돈다.
  #   (코드만 push 할 때는 빌드 안 함 → 결제/한도 문제 재발 방지)
  push:
    tags: ['v*']
  workflow_dispatch: {}

# 같은 ref 의 중복/연속 빌드는 이전 것을 자동 취소 (병렬 낭비·분 소진 방지)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # Release publish 권한 (tag push 시)

jobs:
  build:
    runs-on: windows-latest
    # 첫 빌드(캐시 없음): PyInstaller ~27분 + cargo tauri build(Rust cold) ~25분 + 기타 = ~55~70분.
    #   v2.3.0: 첫 빌드가 60분에서 'Build Tauri' 도중 잘려(취소) 캐시 저장도 안 됨 → 90분으로 상향.
    #   캐시 hit 후: 10~15분. tauri-cli 는 프리빌트 바이너리 설치로 ~18분 → ~1분 단축(아래).
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'   # Vite 8 최소 요구 버전 (^20.19.0)
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Tauri CLI
        # v2.3.0: 소스 컴파일(cargo install, 캐시 없으면 ~18분) 대신 프리빌트 바이너리 설치(~1분).
        #   비용·시간 절감 + cold 빌드가 60분에 잘리던 문제 완화. 설치 툴은 latest 2.x (기존 ^2.0 과 동일).
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # 순서 주의: frontend dist 가 먼저 만들어져야 PyInstaller spec 이
      # frontend/dist 를 frontend_dist 리소스로 패키징할 수 있다.
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify frontend build output
        run: |
          if (-not (Test-Path frontend/dist/index.html)) {
            throw "frontend/dist/index.html not found — npm run build failed silently"
          }
          $size = [math]::Round((Get-ChildItem frontend/dist -Recurse | Measure-Object Length -Sum).Sum / 1MB, 2)
          Write-Host "frontend/dist size: $size MB"
        shell: pwsh

      - name: Install backend Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller==6.10.0

      - name: Build backend sidecar (PyInstaller)
        run: |
          if (Test-Path dist/dbcare-backend) { Remove-Item dist/dbcare-backend -Recurse -Force }
          python -m PyInstaller --noconfirm dbcare-backend.spec
          if (-not (Test-Path dist/dbcare-backend/dbcare-backend.exe)) {
            throw "Backend exe not built"
          }
          # 검증: spec datas 에 추가한 frontend_dist 가 실제로 들어갔는지
          if (-not (Test-Path dist/dbcare-backend/_internal/frontend_dist/index.html)) {
            throw "frontend_dist/index.html missing from PyInstaller output — spec datas 추가 확인 필요"
          }
          # 검증: 6개 모델 pkl 이 번들에 포함됐는지
          $modelDir = "dist/dbcare-backend/_internal/backend/ml/models"
          foreach ($pkl in @("dkd_model.pkl","retinopathy_model.pkl","cvd_model.pkl","neuropathy_final.pkl","dementia_final.pkl","cerebrovascular_final.pkl")) {
            if (-not (Test-Path "$modelDir/$pkl")) { throw "Model missing from bundle: $pkl" }
          }
          # 검증: ML native 바이너리 (CatBoost / VC++ 런타임) 번들 포함
          $internal = "dist/dbcare-backend/_internal"
          $catboost = Get-ChildItem -Path $internal -Recurse -Include "_catboost*.pyd","*catboost*.dll" -ErrorAction SilentlyContinue
          if (-not $catboost) { throw "CatBoost native binary (_catboost.pyd) missing — PyInstaller collect_all 확인" }
          Write-Host "CatBoost native: $($catboost[0].Name)"
          $vcrt = Get-ChildItem -Path $internal -Recurse -Include "vcruntime*.dll","msvcp*.dll" -ErrorAction SilentlyContinue
          Write-Host "VC++ runtime DLLs bundled: $($vcrt.Count)"
        shell: pwsh

      - name: Smoke test backend exe (boot + /health + 6 models)
        run: |
          $env:DBCARE_PORT = "18765"
          $env:DBCARE_SEED = "1"   # CI 검증용 시드 환자 10명 생성 (patient_id=1 존재 보장)
          $proc = Start-Process -FilePath "dist/dbcare-backend/dbcare-backend.exe" -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 1
              try {
                $res = Invoke-WebRequest -Uri "http://127.0.0.1:18765/health" -TimeoutSec 2 -UseBasicParsing
                if ($res.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw "Backend exe failed to start (no /health response within 40s)" }
            Write-Host "Backend /health OK: $($res.Content)"

            # ML 검증: 환자 1번 예측 → 6개 모델 모두 ml_model (fallback_dummy 아님)
            $body = '{"patient_id":1}'
            $pred = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/v1/predict" -Method Post -Body $body -ContentType "application/json" -TimeoutSec 15
            $data = $pred.data
            $models = @("kidney_disease","retinopathy","cardiovascular","neuropathy","dementia","cerebrovascular")
            foreach ($m in $models) {
              $info = $data.$m
              if (-not $info.available) { throw "Model not available: $m" }
              if ($info.risk_source -eq "fallback_dummy") { throw "Model fell back to dummy (pkl load 실패): $m" }
              Write-Host ("  {0,-16} score={1} level={2} source={3}" -f $m, $info.score, $info.level, $info.risk_source)
            }
            Write-Host "6개 ML 모델 전부 정상 예측 확인"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
        shell: pwsh

      - name: Copy backend → src-tauri/resources/
        run: |
          $dest = "src-tauri/resources/dbcare-backend"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item "dist/dbcare-backend/*" -Destination $dest -Recurse -Force
          $size = [math]::Round((Get-ChildItem $dest -Recurse | Measure-Object Length -Sum).Sum / 1MB, 2)
          Write-Host "Sidecar size: $size MB"
        shell: pwsh

      - name: Clean stale bundle outputs
        run: |
          # Rust target 캐시 공유로 이전 빌드 산출물(옛 버전 .exe/.msi)이 남아
          # release/artifact 에 섞이는 것 방지. bundle 만 지우고 캐시(deps)는 유지.
          $bundle = "src-tauri/target/release/bundle"
          if (Test-Path $bundle) { Remove-Item $bundle -Recurse -Force }
        shell: pwsh

      - name: Build Tauri (MSI + NSIS)
        run: cargo tauri build
        env:
          CARGO_TERM_COLOR: always

      - name: List build artifacts
        run: |
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.exe','.msi' } |
            Select-Object FullName, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}} |
            Format-Table -AutoSize
        shell: pwsh

      # artifact 는 보조(디버그용). quota 초과해도 release 직접 업로드로 배포하므로
      # 실패해도 job 을 멈추지 않는다 (continue-on-error).
      - name: Upload MSI artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: DB-care-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 3

      - name: Upload NSIS artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: DB-care-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 3

      # ★ 배포 경로: tag(v*) push 시 빌드 산출물을 Release 에 직접 업로드.
      #   Release 저장소는 artifact quota 와 별도라 항상 가능.
      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
